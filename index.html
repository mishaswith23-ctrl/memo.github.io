body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .22s cubic-bezier(.3,1.5,.5,1),filter .2s,background .25s,color .25s}
button:active,.row:active{transform:scale(.95);filter:brightness(1.25)}
.glow{position:relative;overflow:hidden;background:#060608;border:1px solid var(--line);border-radius:34px;text-align:center;padding:34px 20px 22px;margin-bottom:12px}

@keyframes breathe{50%{opacity:.5}}
.glow>*{position:relative}
.num{font-size:84px;font-weight:700;letter-spacing:-3px;line-height:1}
.lbl{color:#b8c4d8;margin:6px 0 22px;font-size:17px}
.pill{width:100%;padding:17px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);font-weight:600;font-size:17px;backdrop-filter:blur(8px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile,.wide,.stat,.row{background:var(--card);border:1px solid var(--line);border-radius:28px;text-align:left}
.tile{padding:20px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:34px;letter-spacing:-1px}.tile span{color:var(--mute)}
.wide{display:flex;gap:14px;align-items:center;padding:16px;width:100%;margin-bottom:12px}

.wide b{display:block;font-size:18px}.wide small{color:var(--mute);font-size:15px}
.top{display:flex;align-items:center;gap:10px;padding:8px 0}
.seg{display:flex;flex:1;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:11px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:#000}
.plus{width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px;flex:none}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 0}
.card{flex:1;min-height:0;border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);cursor:pointer}
.card.front{animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}

@keyframes flipin{from{opacity:.2;transform:perspective(900px) rotateY(-80deg)}to{opacity:1;transform:none}}
.pic{position:relative;overflow:hidden;display:grid;place-items:center;font-size:100px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .pic{flex:1}
.front .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 26px;text-align:center;font-weight:600;font-size:21px;line-height:1.35;white-space:pre-line;background:linear-gradient(transparent,rgba(0,0,0,.9) 60%)}
.back{padding:14px 16px 76px;gap:16px}

.count{text-align:center;color:var(--mute);padding:8px 0 6px;font-size:15px}

.glow .chip{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-size:14px;margin-bottom:12px}
.prog i{background:linear-gradient(90deg,#f2701d,#ffb347)}

const chCards=k=>[...S.cards].sort((a,b)=>a.id-b.id).slice(k*CH,k*CH+CH);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const queue=()=>{if(S.ch>=chCount())S.ch=0;const ids=chCards(S.ch).map(c=>c.id);if(!S.ord||S.ordCh!==S.ch||S.ord.length!==ids.length){S.ord=shuffle(ids);S.ordCh=S.ch}const m=new Map(S.cards.map(c=>[c.id,c]));return S.ord.map(id=>m.get(id)).filter(c=>c&&(S.mode==="dremo"||c.due<=Date.now()))};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/^\s*-\s*/gm,""));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function topBar(){return`<div class="top"><div class="seg"><button data-m="memo" class="${S.mode==="memo"?"on":""}">Memo</button><button data-m="dremo" class="${S.mode==="dremo"?"on":""}">Dremo</button></div><button class="plus" id="add">+</button></div>`}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',train:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',decks:'<path d="M12 3l9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/>'};
function render(){
const v=document.getElementById("view");
document.getElementById("nav").innerHTML=["home","train","decks","music","me"].map(k=>`<button data-t="${k}" class="${S.tab===k?"on":""}"><svg viewBox="0 0 24 24">${IC[k]}</svg></button>`).join("");
if(S.tab==="home"){
 const n=chCount(),due=chCards(S.ch).filter(c=>c.due<=Date.now()).length,learned=S.cards.filter(c=>c.box>=4).length;
 v.innerHTML=`<div class="scroll"><div class="ttl"><h1>Чайхана</h1><p>Английский по ситуациям</p></div><div class="glow"><div class="chip">Глава ${S.ch+1} из ${n}</div><div class="num">${due}</div><div class="lbl">карточек к повторению</div><button class="pill" data-c="${S.ch}">Начать тренировку</button></div><div class="tiles"><button class="tile" data-t="decks"><b>${n}</b><span>Глав по ${CH} карточек</span></button><button class="tile" data-t="me"><b>${learned}</b><span>Выучено</span></button></div><button class="wide" id="add"><i>＋</i><div><b>Добавить карточку</b><small>Своя фраза и фото</small></div></button></div>`;
}else if(S.tab==="train"){
 const q=queue();if(S.i>=q.length)S.i=0;const c=q[S.i];let h=topBar();
 if(!c){h+=`<main><div class="empty">${S.mode==="memo"?"Глава на сегодня пройдена 🎉<br><br><button class=\"pill\" data-c=\""+((S.ch+1)%chCount())+"\">Следующая глава →</button>":"Колода пуста. Нажмите «+»."}</div></main>`}
 else{
  h+=`<main><div class="card ${S.flip?"back":"front"}" id="card">`+(S.flip?`${pic(c)}<div class="en">${esc(c.en)}</div><button class="fab l" id="del">⋯</button>`:`${pic(c)}<div class="cap">${esc(c.ru)}</div><button class="fab l" id="del">⋯</button>`)+`</div></main>
  <div class="prog"><i style="width:${(S.i+1)/q.length*100}%"></i></div><div class="count">Глава ${S.ch+1} · ${S.i+1} из ${q.length}</div>`;
  if(S.mode==="memo"&&S.flip)h+=`<div class="acts"><button class="nok" data-r="0">Не помню</button><button class="ok" data-r="1">Помню</button></div>`;
  else if(S.mode==="dremo")h+=`<div class="acts"><button class="nav" data-n="-1">←</button><button class="nav" data-n="1">→</button></div>`;
  else h+=`<div class="acts" style="color:var(--mute);justify-content:center;padding-bottom:12px">Вспомните английский вариант и нажмите на карточку</div>`;
 }
 v.innerHTML=h;
}else if(S.tab==="decks"){
 const n=chCount();
 v.innerHTML=`<div class="scroll"><div class="ttl"><h1>Главы</h1><p>${S.cards.length} ситуаций · по ${CH} в главе</p></div>`+Array.from({length:n},(_,k)=>{const cs=chCards(k),L=cs.filter(c=>c.box>=4).length;return `<button class="row chap" data-c="${k}">${cs[0]?pic(cs[0]):""}<div class="t"><b>Глава ${k+1}${k===S.ch?" · текущая":""}</b><small>${cs.length} карточек · выучено ${L}</small><div class="mini"><i style="width:${cs.length?L/cs.length*100:0}%"></i></div></div><span class="go">›</span></button>`}).join("")+`</div>`;
}else if(S.tab==="music"){
 const mv=musicPrefs.volume, cutoff=musicPrefs.cutoff;
 v.innerHTML=`<div class="scroll"><div style="padding:4px 3px 10px"><div class="deck" style="font-size:24px">Фоновая музыка</div><div class="subdeck">Музыка во время изучения карточек</div></div><section class="music-panel"><div class="music-hero"><div class="music-art">🎧</div><div><div class="music-title" id="musicTrackName">Твой саундтрек</div><div class="music-sub" id="musicTrackStatus">Фоновый трек · background.mp3</div></div></div><div class="music-sub">Трек загружается с сайта автоматически</div><div class="music-control"><div class="music-control-head"><label for="musicVolume">Громкость</label><output id="volumeOut">${Math.round(mv*100)}%</output></div><input id="musicVolume" type="range" min="0" max="100" step="1" value="${Math.round(mv*100)}"></div><div class="music-control"><div class="music-control-head"><label for="musicCutoff">Лоупасс · срез высоких частот</label><output id="cutoffOut">${cutoff>=20000?'Выкл.':cutoff>=1000?(cutoff/1000).toFixed(1)+' кГц':Math.round(cutoff)+' Гц'}</output></div><input id="musicCutoff" type="range" min="200" max="20000" step="100" value="${cutoff}"><div class="music-sub">Меньше значение — более глухой, басовый звук.</div></div><div class="music-actions"><button id="musicPlay">▶︎ Воспроизвести</button><button id="musicStop" class="secondary">■ Стоп</button></div><p class="music-note">Музыка загружается с сайта. Нажми «Воспроизвести»; громкость и лоупасс сохраняются. Автовоспроизведение может блокироваться браузером до нажатия кнопки.</p></section></div>`;
}else{
 const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user,nm=(u&&u.first_name)||"Гость",due=S.cards.filter(c=>c.due<=Date.now()).length,learned=S.cards.filter(c=>c.box>=4).length;
 v.innerHTML=`<div class="scroll"><div class="ttl"><h1>Профиль</h1></div><div class="wide"><div class="av">${esc(nm[0].toUpperCase())}</div><div><b>${esc(nm)}</b><small>Прогресс сохраняется в Telegram</small></div></div><div class="tiles"><div class="tile"><b>${learned}</b><span>Выучено</span></div><div class="tile"><b>${due}</b><span>К повторению</span></div></div><div class="stat">Memo — вспоминаете фразу и проверяете себя. Dremo — просмотр и прослушивание в своём темпе.</div><div class="acts"><button class="nok" id="reset">Сбросить прогресс</button></div></div>`;
}
bind();}
const musicPrefs=(()=>{try{return {volume:Math.max(0,Math.min(1,Number(localStorage.getItem('music_volume')??0.22))),cutoff:Math.max(200,Math.min(20000,Number(localStorage.getItem('music_cutoff')??8500)))}}catch(_){return {volume:.22,cutoff:8500}}})();
let musicAudio=null,musicUrl=null,audioCtx=null,lowpassNode=null,mediaSource=null,musicReady=false;
function ensureMusicAudio(){
 if(!musicAudio){musicAudio=new Audio('./background.mp3');musicAudio.loop=true;musicAudio.preload='metadata';musicAudio.volume=musicPrefs.volume;musicAudio.addEventListener('error',()=>{const st=document.getElementById('musicTrackStatus');if(st)st.textContent='Не удалось прочитать аудиофайл. Попробуй MP3 или M4A.'});musicAudio.addEventListener('play',()=>{const st=document.getElementById('musicTrackStatus');if(st)st.textContent='Сейчас играет · фоновый режим';const b=document.getElementById('musicPlay');if(b)b.textContent='Ⅱ Пауза'});musicAudio.addEventListener('pause',()=>{const b=document.getElementById('musicPlay');if(b)b.textContent='▶︎ Воспроизвести'});musicAudio.addEventListener('ended',()=>{const b=document.getElementById('musicPlay');if(b)b.textContent='▶︎ Воспроизвести'});}
 return musicAudio;
}
function setupMusicFilter(){
 const a=ensureMusicAudio();
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audioCtx){audioCtx=new AC();mediaSource=audioCtx.createMediaElementSource(a);lowpassNode=audioCtx.createBiquadFilter();lowpassNode.type='lowpass';mediaSource.connect(lowpassNode);lowpassNode.connect(audioCtx.destination)}
  lowpassNode.frequency.value=musicPrefs.cutoff;
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});musicReady=true;
 }catch(e){console.warn('Low-pass unavailable',e)}
}
function bind(){
const $=s=>document.querySelector(s);
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;if(S.tab==="train")S.ord=null;S.i=0;S.flip=false;render()});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.ord=null;S.tab="train";S.i=0;S.flip=false;render()});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.ch=+b.dataset.c;S.ord=null;S.tab="train";S.i=0;S.flip=false;render()});
const a=$("#add");if(a)a.onclick=()=>$("#dlg").showModal();
const card=$("#card");if(card)card.onclick=e=>{if(e.target.closest(".fab"))return;S.flip=!S.flip;render()};
const snd=$("#snd");if(snd)snd.onclick=()=>speak(queue()[S.i].en);
const del=$("#del");if(del)del.onclick=()=>{if(confirm("Удалить карточку?")){const c=queue()[S.i];S.cards=S.cards.filter(x=>x.id!==c.id);save();S.flip=false;render()}};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const c=queue()[S.i];if(b.dataset.r==="1"){c.box=Math.min(c.box+1,5)}else c.box=0;c.due=Date.now()+GAPS[c.box]*DAY;if(c.box===0)c.due=Date.now()+6e4;save();S.flip=false;render()});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=queue().length;S.i=(S.i+ +b.dataset.n+n)%n;S.flip=false;render()});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.cards=S.cards.filter(x=>x.id!==+b.dataset.d);save();render()});
const rs=$("#reset");if(rs)rs.onclick=()=>{if(confirm("Сбросить весь прогресс?")){S.cards.forEach(c=>{c.box=0;c.due=0});save();S.tab="train";render()}};
const trackName=$("#musicTrackName");if(trackName)trackName.textContent='Фоновая музыка';const trackStatus=$("#musicTrackStatus");if(trackStatus)trackStatus.textContent='Готово к воспроизведению';
const vol=$("#musicVolume");if(vol)vol.oninput=()=>{musicPrefs.volume=Number(vol.value)/100;ensureMusicAudio().volume=musicPrefs.volume;try{localStorage.setItem('music_volume',String(musicPrefs.volume))}catch(_){}const out=$("#volumeOut");if(out)out.textContent=vol.value+'%'};
const cut=$("#musicCutoff");if(cut)cut.oninput=()=>{musicPrefs.cutoff=Number(cut.value);if(lowpassNode)lowpassNode.frequency.setTargetAtTime(musicPrefs.cutoff,audioCtx.currentTime,.03);try{localStorage.setItem('music_cutoff',String(musicPrefs.cutoff))}catch(_){}const out=$("#cutoffOut");if(out)out.textContent=musicPrefs.cutoff>=20000?'Выкл.':musicPrefs.cutoff>=1000?(musicPrefs.cutoff/1000).toFixed(1)+' кГц':Math.round(musicPrefs.cutoff)+' Гц'};
const play=$("#musicPlay");if(play)play.onclick=async()=>{const a=ensureMusicAudio();if(!a.src){a.src='./background.mp3';a.load()}setupMusicFilter();try{if(!a.paused){a.pause();return}if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();await a.play()}catch(e){const st=$("#musicTrackStatus");if(st)st.textContent='Не удалось запустить файл. Выбери другой аудиофайл.'}};
const stop=$("#musicStop");if(stop)stop.onclick=()=>{if(musicAudio){musicAudio.pause();musicAudio.currentTime=0}const st=$("#musicTrackStatus");if(st)st.textContent='Остановлено';const b=$("#musicPlay");if(b)b.textContent='▶︎ Воспроизвести'};
}
const dlg=document.getElementById("dlg");let imgData="";
document.getElementById("cancel").onclick=()=>dlg.close();
document.getElementById("fImg").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);imgData=cv.toDataURL("image/jpeg",.75)};im.src=r.result};r.readAsDataURL(f)};
document.getElementById("save").onclick=()=>{const ru=fRu.value.trim(),en=fEn.value.trim();if(!ru||!en)return;S.cards.push({id:Date.now(),ru,en,img:imgData,box:0,due:0});save();fRu.value=fEn.value=fImg.value="";imgData="";dlg.close();S.ch=chCount()-1;S.ord=null;S.tab="train";render()};
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,.card,.row")){try{TG.HapticFeedback.impactOccurred("light")}catch(_){}}});
load();
</script>
</body>
</html>
