<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чайхана Английский</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#0d0d0f;--line:rgba(255,255,255,.09);--ink:#fff;--mute:#8b8d96;--chip:#1b1b1f;--ok:#2fbf84;--bad:#e5534b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.scroll{flex:1;overflow:auto;padding-bottom:12px}
.ttl{padding:12px 4px 14px}.ttl h1{font-size:38px;letter-spacing:-1px;margin:0;line-height:1.05}.ttl p{margin:6px 0 0;color:var(--mute);font-size:17px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .22s cubic-bezier(.3,1.5,.5,1),filter .2s,background .25s,color .25s}
button:active,.row:active{transform:scale(.95);filter:brightness(1.25)}
.glow{position:relative;overflow:hidden;background:#060608;border:1px solid var(--line);border-radius:34px;text-align:center;padding:34px 20px 22px;margin-bottom:12px}
.glow::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 50% 25%,#35b6ff 0,#0b63e0 40%,transparent 75%);-webkit-mask:radial-gradient(circle,#000 42%,transparent 48%) 0 0/9px 9px;mask:radial-gradient(circle,#000 42%,transparent 48%) 0 0/9px 9px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
.glow>*{position:relative}
.num{font-size:84px;font-weight:700;letter-spacing:-3px;line-height:1}
.lbl{color:#b8c4d8;margin:6px 0 22px;font-size:17px}
.pill{width:100%;padding:17px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);font-weight:600;font-size:17px;backdrop-filter:blur(8px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile,.wide,.stat,.row{background:var(--card);border:1px solid var(--line);border-radius:28px;text-align:left}
.tile{padding:20px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:34px;letter-spacing:-1px}.tile span{color:var(--mute)}
.wide{display:flex;gap:14px;align-items:center;padding:16px;width:100%;margin-bottom:12px}
.wide i{width:48px;height:48px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:26px;flex:none}
.wide b{display:block;font-size:18px}.wide small{color:var(--mute);font-size:15px}
.top{display:flex;align-items:center;gap:10px;padding:8px 0}
.seg{display:flex;flex:1;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{flex:1;padding:11px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:#000}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 0;position:relative}
/* Карточка с настоящим 3D-переворотом: обе стороны в DOM, крутится .inner */
.card{flex:1;min-height:0;position:relative;border-radius:34px;perspective:1400px;cursor:pointer;animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}
.inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .6s cubic-bezier(.25,.9,.3,1.12)}
.inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:border-color .2s}
.face.back{transform:rotateY(180deg)}
.inner:not(.flipped) .back,.inner.flipped .front{pointer-events:none}
/* iOS Safari игнорирует backface-visibility у детей с backdrop-filter — прячем невидимую сторону целиком на середине поворота */
.face{transition:border-color .2s,visibility 0s .12s}
.inner:not(.flipped) .back,.inner.flipped .front{visibility:hidden}
.card.still{cursor:default}
.hint{position:absolute;top:16px;left:16px;z-index:2;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);font-size:14px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.study{padding:14px 16px 76px;gap:12px}
.study .pic{flex:1;min-height:150px;border-radius:24px;font-size:64px}
.study .en{padding:0 4px}
.study .ru{padding-top:12px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.pic{position:relative;overflow:hidden;display:grid;place-items:center;font-size:100px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .pic{flex:1}
.front .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 26px;text-align:center;font-weight:600;font-size:21px;line-height:1.35;white-space:pre-line;background:linear-gradient(transparent,rgba(0,0,0,.9) 60%)}
.back{padding:14px 16px 76px;gap:16px}
.back .pic{height:38%;min-height:130px;border-radius:24px;flex:none;font-size:64px}
.en{font-weight:700;font-size:23px;line-height:1.4;text-align:center;white-space:pre-line;letter-spacing:-.3px}
.ru{color:var(--mute);font-size:17px;text-align:center;line-height:1.4;border-top:1px solid var(--line);padding-top:14px;white-space:pre-line}
.fab{position:absolute;bottom:14px;width:48px;height:48px;border-radius:50%;background:rgba(30,30,34,.75);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:20px;color:#fff}
.l{left:14px}.r{right:14px}
.prog{height:5px;margin:8px 30px 0;border-radius:9px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2a8cff,#35b6ff);transition:width .4s}
.count{text-align:center;color:var(--mute);padding:8px 0 6px;font-size:15px}
.acts{display:flex;gap:10px;padding:0 0 10px}
.acts button{flex:1;padding:17px;border-radius:999px;font-weight:600;font-size:17px}
.nok{background:var(--bad)}.ok{background:var(--ok)}.nav{background:var(--chip);border:1px solid var(--line)}
.empty{margin:auto;text-align:center;color:var(--mute);padding:30px;font-size:18px;line-height:1.5}
nav{display:flex;gap:4px;margin:6px 16px 12px;padding:8px;border-radius:999px;background:#101012;border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav button{flex:1;height:54px;border-radius:999px;color:#6f717a;display:grid;place-items:center}
nav button.on{background:#1f1f23;color:#fff}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.row{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px;border-radius:24px;animation:pop .35s both}
.row .pic{width:60px;height:60px;border-radius:16px;font-size:28px;flex:none}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:15px}.row small{color:var(--mute)}
.row button{font-size:20px;padding:8px}
.stat{padding:18px;margin-bottom:12px;line-height:1.5;color:var(--mute)}
.av{width:60px;height:60px;border-radius:20px;background:var(--chip);display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff}

.glow::before{background:radial-gradient(ellipse 55% 60% at 50% 30%,#ffc14d 0,#f2701d 42%,transparent 76%) no-repeat;animation:drift 11s ease-in-out infinite}
@keyframes drift{0%,100%{background-size:100% 100%;background-position:0 0}35%{background-size:68% 68%;background-position:85% 8%}70%{background-size:84% 84%;background-position:10% 45%}}
.glow .chip{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-size:14px;margin-bottom:12px}
.prog i{background:linear-gradient(90deg,#f2701d,#ffb347)}
.back{padding:14px 16px 76px;gap:14px;justify-content:flex-start}
.back .pic{height:auto;flex:1;min-height:180px}
.back .en{padding:6px 4px 28px}
.chap{width:100%;color:var(--ink);font:inherit}.chap .go{color:var(--mute);font-size:26px;padding-right:6px}
.mini{height:4px;border-radius:9px;background:var(--chip);margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:#f2701d}
.music-panel{padding:20px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.music-hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.music-art{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#ffb347,#e0561a)}
.music-title{font-size:17px;font-weight:700}.music-sub{font-size:13px;color:var(--mute);margin-top:4px}
.music-control{margin:18px 0}.music-control-head{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:10px}.music-control output{color:var(--mute)}
.music-control input{width:100%;accent-color:#f2701d}
.music-actions{display:flex;gap:10px}.music-actions button{flex:1;border-radius:999px;padding:15px;font-weight:600;background:#f2701d;color:#000}.music-actions .secondary{background:var(--chip);color:#fff}
.music-note{font-size:12px;color:var(--mute);line-height:1.5}

/* Игровые элементы: уровень, комбо, награды */
.lv{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;font-weight:800;font-size:17px;background:conic-gradient(#ffb347 calc(var(--p)*1%),#26262b 0)}
.lv::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.lv span{position:relative}
.lv.up{animation:lvup .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvup{40%{transform:scale(1.3);box-shadow:0 0 30px #ffb347}}
.hud{display:flex;gap:8px;margin-bottom:12px}
.hchip{flex:1;padding:12px 6px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:13px;color:var(--mute)}
.hchip b{display:block;font-size:21px;color:#fff;margin-bottom:2px;white-space:nowrap}
.hchip.hot b{color:#ffb347}
.nudge{margin:-2px 4px 12px;color:#ffb347;font-size:14px;animation:breathe 2.4s ease-in-out infinite}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f2701d,#ffd166);transition:width .6s}
.combo{position:absolute;top:18px;right:14px;z-index:3;padding:7px 13px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,179,71,.5);color:#ffb347;font-weight:800;font-size:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
.combo.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
.combo.big{background:linear-gradient(135deg,#f2701d,#ff3d6e);color:#fff;border-color:transparent;box-shadow:0 0 24px rgba(255,90,60,.6)}
@keyframes bump{0%{transform:scale(.5)}50%{transform:scale(1.35)}}
.ok{background:linear-gradient(180deg,#38d394,#24a873);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.acts .ok.hit{animation:okhit .45s ease-out;box-shadow:0 0 0 5px rgba(47,191,132,.3),0 0 44px rgba(56,211,148,.9);filter:brightness(1.2)}
.acts .nok.hit{animation:shake .4s;filter:brightness(1.15)}
@keyframes okhit{30%{transform:scale(1.07)}}
.card::after{content:"";position:absolute;inset:0;z-index:2;border-radius:34px;pointer-events:none;opacity:0;transition:opacity .2s}
.card.good{animation:goodout .45s ease-in forwards;box-shadow:0 0 0 2px var(--ok),0 0 50px rgba(47,191,132,.5)}
.card.good .face{border-color:var(--ok)}
.card.good::after{background:radial-gradient(circle at 50% 60%,rgba(47,191,132,.45),transparent 70%);opacity:1}
.card.bad{animation:shake .45s;box-shadow:0 0 0 2px var(--bad)}
.card.bad .face{border-color:var(--bad)}
.card.bad::after{background:radial-gradient(circle at 50% 60%,rgba(229,83,75,.4),transparent 70%);opacity:1}
@keyframes goodout{35%{transform:scale(1.03)}100%{transform:translateY(-40px) scale(.94);opacity:0}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.fx{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:rise 1s ease-out forwards}
.fx b{display:block;font-size:26px;font-weight:800;color:#5ef0b0;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.fx small{font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.fx.neg b{color:#ff8a80}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:60;transform:translate(-50%,-160%);display:flex;gap:12px;align-items:center;padding:12px 18px 12px 12px;border-radius:22px;background:rgba(24,24,28,.94);border:1px solid rgba(255,179,71,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.3,1.4,.5,1);width:max-content;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0)}
#toast i{font-style:normal;font-size:28px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#ffb347,#e0561a)}
#toast b{display:block}#toast small{color:var(--mute)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
.win{margin:auto;text-align:center;padding:10px;width:100%}
.win .big{font-size:76px;animation:bump .7s}
.win h2{margin:8px 0 4px;font-size:28px}.win p{margin:0;color:var(--mute)}
.wstats{display:flex;gap:8px;margin:20px 0}
.win .pill,.empty .pill{background:linear-gradient(135deg,#ffb347,#f2701d);color:#000;border:0}
.sec{margin:18px 4px 10px;font-size:20px;font-weight:700}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ach div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mute);line-height:1.3}
.ach i{display:block;font-style:normal;font-size:30px;margin-bottom:6px}
.ach .off i{filter:grayscale(1);opacity:.3}
.ach .on{border-color:rgba(255,179,71,.45);color:#fff}
.seg.goal{margin-bottom:12px;flex:none}
.acts.hintline{min-height:66px;color:var(--mute);justify-content:center;align-items:center;text-align:center;font-size:15px}
.acts .go{flex:2;color:#000}
.hsb{gap:12px;padding:12px 12px 12px 14px;animation:pop .4s both}
.hsb b{font-size:16px}.hsb small{font-size:14px}
.hsgo{padding:11px 16px;border-radius:999px;background:linear-gradient(135deg,#ffb347,#f2701d);color:#000;font-weight:700;font-size:15px;flex:none}
.hsx{color:var(--mute);padding:8px;font-size:16px;flex:none}

/* Главная: строка серии и кольцо цели дня */
.hrow{display:flex;align-items:center;gap:10px;padding:12px 4px 0}
.hrow h1{flex:1;font-size:36px;letter-spacing:-1px;margin:0;line-height:1.05}
.spill{display:flex;align-items:center;height:50px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:18px;white-space:nowrap}
.spill.hot{color:#ffb347;border-color:rgba(255,179,71,.4)}
.sub{margin:4px 4px 14px;color:var(--mute);font-size:16px}
.ring{width:190px;height:190px;margin:0 auto 20px}
.ring::before{content:"";position:absolute;inset:16px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:13}
.ring .bgc{stroke:rgba(255,255,255,.13)}
.ring .fgc{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.ring .mid b{font-size:58px;letter-spacing:-2px;line-height:1}
.ring .mid b span{font-size:24px;letter-spacing:0;color:#d9c8b0}
.ring .mid small{color:#d9c8b0;font-size:15px;margin-top:6px}
.ring.full{filter:drop-shadow(0 0 18px rgba(255,179,71,.6))}
.glow .pill{background:#fff;color:#000;border:0}
.glow .lbl{margin:12px 0 0;font-size:14px}

/* Вводный экран */
.onb{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 4px 20px}
.onb .skip{align-self:flex-end;color:var(--mute);padding:10px 4px;font-size:16px}
.onb .stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;text-align:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.1)}
.onb .stage::before,.onb .stage::after{content:"";flex:1} /* центрирует, но не обрезает верх на маленьких экранах */
.onb .art{font-size:96px;margin-bottom:18px}
.onb h2{font-size:32px;letter-spacing:-.8px;margin:0 0 12px;line-height:1.1}
.onb p{color:var(--mute);font-size:17px;line-height:1.5;margin:0 auto;max-width:330px}
.onb .pill{background:#fff;color:#000;border:0}
.steps{text-align:left;margin:14px auto 0;max-width:340px;width:100%;display:grid;gap:10px}
.steps div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:16px}
.steps i{font-style:normal;font-size:22px}
.steps .em{border-color:rgba(255,179,71,.45);color:#ffb347;font-weight:600}
.demo{width:220px;height:124px;margin:0 auto;perspective:800px}
.demo>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:demo 4.5s ease-in-out infinite}
.demo span{position:absolute;inset:0;display:grid;place-items:center;padding:12px;border-radius:22px;background:linear-gradient(145deg,#6b3b1d,#2e180a);border:1px solid var(--line);font-weight:700;font-size:16px;line-height:1.35;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.demo span+span{transform:rotateY(180deg);background:linear-gradient(145deg,#14503f,#0a2a22)}
@keyframes demo{0%,35%{transform:none}50%,85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.goals{display:grid;gap:10px;margin:22px auto 0;max-width:340px;width:100%}
.goals button{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:22px;background:var(--card);border:1px solid var(--line);text-align:left}
.goals button.on{border-color:#ffb347;background:rgba(242,112,29,.14)}
.goals .t{display:block;font-size:18px;font-weight:700}.goals small{color:var(--mute);font-size:14px}
.goals .n{font-size:30px;font-weight:800}
.goals .on .n{color:#ffb347}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--chip);transition:width .3s}
.dots i.on{width:24px;background:#ffb347}
</style>
</head>
<body>
<div id="app">
<div id="view" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
<nav id="nav"></nav>
</div>
<script>
function showErr(m){try{const v=document.getElementById("view");v.textContent="Ошибка: "+m;v.style.cssText="padding:20px;color:#d9534f;word-break:break-word"}catch(_){}}
window.addEventListener("error",e=>showErr(e.message+" (строка "+e.lineno+")"));

 let tc=S.ch;for(let j=0;j<n;j++){const k=(S.ch+j)%n;if(dueIn(k)){tc=k;break}} // ближайшая глава, где есть что повторять

 }

 v.innerHTML=`<div class="scroll"><div style="padding:4px 3px 10px"><div class="deck" style="font-size:24px">Фоновая музыка</div><div class="subdeck">Музыка во время изучения карточек</div></div><section class="music-panel"><div class="music-hero"><div class="music-art">🎧</div><div><div class="music-title" id="musicTrackName">Твой саундтрек</div><div class="music-sub" id="musicTrackStatus">Фоновый трек · background.mp3</div></div></div><div class="music-sub">Трек загружается с сайта автоматически</div><div class="music-control"><div class="music-control-head"><label for="musicVolume">Громкость</label><output id="volumeOut">${Math.round(mv*100)}%</output></div><input id="musicVolume" type="range" min="0" max="100" step="1" value="${Math.round(mv*100)}"></div><div class="music-control"><div class="music-control-head"><label for="musicCutoff">Лоупасс · срез высоких частот</label><output id="cutoffOut">${cutoff>=20000?'Выкл.':cutoff>=1000?(cutoff/1000).toFixed(1)+' кГц':Math.round(cutoff)+' Гц'}</output></div><input id="musicCutoff" type="range" min="200" max="20000" step="100" value="${cutoff}"><div class="music-sub">Меньше значение — более глухой, басовый звук.</div></div><div class="music-actions"><button id="musicPlay">▶︎ Воспроизвести</button><button id="musicStop" class="secondary">■ Стоп</button></div><p class="music-note">Музыка загружается с сайта. Нажми «Воспроизвести»; громкость и лоупасс сохраняются. Автовоспроизведение может блокироваться браузером до нажатия кнопки.</p></section></div>`;
}else{
 const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user,nm=(u&&u.first_name)||"Гость",due=S.cards.filter(c=>c.due<=Date.now()).length,learned=S.cards.filter(c=>c.box>=4).length;
 const L=lvlOf(G.xp),st=streak();
 v.innerHTML=`<div class="scroll"><div class="ttl"><h1>Профиль</h1></div><div class="wide"><div class="av">${esc(nm[0].toUpperCase())}</div><div style="flex:1"><b>${esc(nm)}</b><small>Ур. ${L.l} · ${L.name} · ${G.xp} XP</small><div class="bar"><i style="width:${L.pct}%"></i></div></div></div>
 <div class="tiles"><div class="tile"><b>${learned}</b><span>Выучено</span></div><div class="tile"><b>${due}</b><span>К повторению</span></div><div class="tile"><b>🔥 ${st}</b><span>${daysWord(st)} подряд</span></div><div class="tile"><b>×${G.best||0}</b><span>Лучшее комбо</span></div></div>
 <div class="sec">Достижения · ${G.ach.length}/${ACH.length}</div><div class="ach">${ACH.map(([id,ic,t,d])=>`<div class="${G.ach.includes(id)?"on":"off"}"><i>${ic}</i><b>${t}</b><br>${d}</div>`).join("")}</div>
 <div class="sec">Настройки</div><button class="wide" id="sfxT"><i>${SFX.on?"🔊":"🔇"}</i><div style="text-align:left"><b>Звуки</b><small>${SFX.on?"Включены":"Выключены"}</small></div></button>
 ${HS==="unsupported"?"":HS==="added"?`<div class="wide"><i>📲</i><div><b>Главный экран</b><small>✓ Чайхана уже добавлена</small></div></div>`:`<button class="wide" id="hsAdd"><i>📲</i><div style="text-align:left"><b>Добавить на главный экран</b><small>Значок приложения на телефоне</small></div></button>`}
 <div style="color:var(--mute);margin:4px 4px 8px">Цель дня — карточек</div><div class="seg goal">${[10,20,40].map(g=>`<button data-g="${g}" class="${G.goal===g?"on":""}">${g}</button>`).join("")}</div>
 <div class="stat">Вспоминать — достаёшь фразу из памяти, говоришь вслух и честно отмечаешь результат. Изучать — спокойно смотришь и слушаешь фразы главы перед тренировкой.</div><div class="acts"><button class="nok" id="reset">Сбросить прогресс</button></div></div>`;
}
bind();}
const musicPrefs=(()=>{try{return {volume:Math.max(0,Math.min(1,Number(localStorage.getItem('music_volume')??0.22))),cutoff:Math.max(200,Math.min(20000,Number(localStorage.getItem('music_cutoff')??8500)))}}catch(_){return {volume:.22,cutoff:8500}}})();
let musicAudio=null,musicUrl=null,audioCtx=null,lowpassNode=null,mediaSource=null,musicReady=false;
function ensureMusicAudio(){
 if(!musicAudio){musicAudio=new Audio('./background.mp3');musicAudio.loop=true;musicAudio.preload='metadata';musicAudio.volume=musicPrefs.volume;musicAudio.addEventListener('error',()=>{const st=document.getElementById('musicTrackStatus');if(st)st.textContent='Не удалось прочитать аудиофайл. Попробуй MP3 или M4A.'});musicAudio.addEventListener('play',()=>{const st=document.getElementById('musicTrackStatus');if(st)st.textContent='Сейчас играет · фоновый режим';const b=document.getElementById('musicPlay');if(b)b.textContent='Ⅱ Пауза'});musicAudio.addEventListener('pause',()=>{const b=document.getElementById('musicPlay');if(b)b.textContent='▶︎ Воспроизвести'});musicAudio.addEventListener('ended',()=>{const b=document.getElementById('musicPlay');if(b)b.textContent='▶︎ Воспроизвести'});}
 return musicAudio;
}
function setupMusicFilter(){
 const a=ensureMusicAudio();
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!audioCtx){audioCtx=new AC();mediaSource=audioCtx.createMediaElementSource(a);lowpassNode=audioCtx.createBiquadFilter();lowpassNode.type='lowpass';mediaSource.connect(lowpassNode);lowpassNode.connect(audioCtx.destination)}
  lowpassNode.frequency.value=musicPrefs.cutoff;
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});musicReady=true;
 }catch(e){console.warn('Low-pass unavailable',e)}
}
function bind(){
const $=s=>document.querySelector(s);
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;if(S.tab==="train")S.ord=null;S.i=0;S.flip=false;render()});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.ord=null;S.tab="train";S.i=0;S.flip=false;newSess();render()});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.ch=+b.dataset.c;S.ord=null;S.tab="train";S.i=0;S.flip=false;newSess();render()});
// Переворот без полной перерисовки, чтобы сработала CSS-анимация поворота.
const card=$("#card");if(card)card.onclick=e=>{if(busy||S.mode!=="memo"||e.target.closest(".fab"))return;SFX.flip();S.flip=!S.flip;card.querySelector(".inner").classList.toggle("flipped",S.flip);$("#actsBox").innerHTML=actsHtml(queue());bind()};
const snd=$("#snd");if(snd)snd.onclick=()=>speak(queue()[S.i].en);
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(b,b.dataset.r==="1"));
const go=d=>{const n=queue().length;if(S.i+d<0||S.i+d>=n)return;S.i+=d;S.flip=false;SFX.swish();render()};
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>go(+b.dataset.n));
const mainEl=$("main");if(mainEl&&card&&S.mode!=="memo"){let x0=null;mainEl.ontouchstart=e=>{x0=e.touches[0].clientX};mainEl.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)go(dx<0?1:-1)}}
const oN=$("#oNext");if(oN)oN.onclick=()=>{if((S.onb||0)<2){S.onb=(S.onb||0)+1;render()}else finishOnb(true)};
const hsA=$("#hsAdd");if(hsA)hsA.onclick=addHS;
const hsX=$("#hsX");if(hsX)hsX.onclick=()=>{G.hsHide=1;saveG();render()};
const oS=$("#oSkip");if(oS)oS.onclick=()=>finishOnb(false);
document.querySelectorAll("[data-og]").forEach(b=>b.onclick=()=>{G.goal=+b.dataset.og;render()});
const sfxT=$("#sfxT");if(sfxT)sfxT.onclick=()=>{SFX.on=!SFX.on;SFX.tap();render()};
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{G.goal=+b.dataset.g;saveG();render()});
const rs=$("#reset");if(rs)rs.onclick=()=>{if(confirm("Сбросить весь прогресс?")){S.cards.forEach(c=>{c.box=0;c.due=0});save();S.tab="train";render()}};
const trackName=$("#musicTrackName");if(trackName)trackName.textContent='Фоновая музыка';const trackStatus=$("#musicTrackStatus");if(trackStatus)trackStatus.textContent='Готово к воспроизведению';
const vol=$("#musicVolume");if(vol)vol.oninput=()=>{musicPrefs.volume=Number(vol.value)/100;ensureMusicAudio().volume=musicPrefs.volume;try{localStorage.setItem('music_volume',String(musicPrefs.volume))}catch(_){}const out=$("#volumeOut");if(out)out.textContent=vol.value+'%'};
const cut=$("#musicCutoff");if(cut)cut.oninput=()=>{musicPrefs.cutoff=Number(cut.value);if(lowpassNode)lowpassNode.frequency.setTargetAtTime(musicPrefs.cutoff,audioCtx.currentTime,.03);try{localStorage.setItem('music_cutoff',String(musicPrefs.cutoff))}catch(_){}const out=$("#cutoffOut");if(out)out.textContent=musicPrefs.cutoff>=20000?'Выкл.':musicPrefs.cutoff>=1000?(musicPrefs.cutoff/1000).toFixed(1)+' кГц':Math.round(musicPrefs.cutoff)+' Гц'};
const play=$("#musicPlay");if(play)play.onclick=async()=>{const a=ensureMusicAudio();if(!a.src){a.src='./background.mp3';a.load()}setupMusicFilter();try{if(!a.paused){a.pause();return}if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();await a.play()}catch(e){const st=$("#musicTrackStatus");if(st)st.textContent='Не удалось запустить файл. Выбери другой аудиофайл.'}};
const stop=$("#musicStop");if(stop)stop.onclick=()=>{if(musicAudio){musicAudio.pause();musicAudio.currentTime=0}const st=$("#musicTrackStatus");if(st)st.textContent='Остановлено';const b=$("#musicPlay");if(b)b.textContent='▶︎ Воспроизвести'};
}
const haptic=k=>{try{TG.HapticFeedback.notificationOccurred(k)}catch(_){}};
// Ярлык на главном экране телефона (Telegram Bot API 8.0+). Статусы: unsupported, unknown, added, missed.
let HS="unsupported";
function checkHS(){try{if(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast("8.0")&&TG.checkHomeScreenStatus)TG.checkHomeScreenStatus(s=>{HS=s||"unknown";render()})}catch(_){}}
function addHS(){try{TG.addToHomeScreen()}catch(_){}}
try{TG&&TG.onEvent&&TG.onEvent("homeScreenAdded",()=>{HS="added";toast("📲","Чайхана на главном экране","Теперь открывается в одно касание",true);render()})}catch(_){}
const canAddHS=()=>HS==="missed"||HS==="unknown";
function finishOnb(start){G.onb=1;saveG();if(start){S.tab="train";S.mode="memo";S.ch=0;S.ord=null;S.i=0;S.flip=false;newSess()}render()}
function rate(btn,good){
 if(busy)return;const c=queue()[S.i];if(!c)return;busy=true;
 const t=today(),ev=[],L0=lvlOf(G.xp).l;
 if(G.last!==t){G.days=G.last===dayStr(-1)?G.days+1:1;G.last=t}
 if(G.day!==t){G.day=t;G.done=0}
 if(++G.done===G.goal)ev.push("goal");
 let gain=2;
 if(good){c.box=Math.min(c.box+1,5);combo++;gain=10+2*Math.min(combo-1,10);G.ok=(G.ok||0)+1;sess.ok++}
 else{c.box=0;combo=0}
 c.due=Date.now()+GAPS[c.box]*DAY;if(c.box===0)c.due=Date.now()+6e4;
 G.best=Math.max(G.best||0,combo);G.xp+=gain;sess.best=Math.max(sess.best,combo);sess.n++;sess.xp+=gain;
 if(lvlOf(G.xp).l>L0)ev.push("lvl");
 save();saveG();
 const milestone=good&&combo>=5&&combo%5===0,cardEl=document.getElementById("card");
 btn.classList.add("hit");if(cardEl)cardEl.classList.add(good?"good":"bad");
 if(good){SFX.ok(combo);if(milestone)SFX.combo()}else SFX.bad();
 haptic(good?"success":"error");
 floatFx(btn,`+${gain} XP`,good?(milestone?`Комбо ×${combo}! 🔥`:pick(PRAISE)):pick(OOPS),!good);
 setTimeout(()=>{
  busy=false;S.flip=false;S.bump=good&&combo>=2;S.lvup=ev.includes("lvl");
  if(S.mode==="memo"&&!queue().length)ev.push("ch");
  render();S.bump=S.lvup=false;celebrate(ev);
 },good?450:500);
}
function floatFx(el,a,b,neg){const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="fx"+(neg?" neg":"");d.style.left=r.left+r.width/2+"px";d.style.top=r.top+"px";d.innerHTML=`<b>${esc(a)}</b><small>${esc(b)}</small>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function celebrate(ev){
 if(ev.includes("lvl")||ev.includes("goal")||ev.includes("ch")){SFX.fanfare();confetti()}
 if(ev.includes("lvl")){const L=lvlOf(G.xp);toast("⭐",`Новый уровень ${L.l}!`,L.name)}
 if(ev.includes("goal"))toast("🎯","Цель дня выполнена!",`${G.goal} карточек — отличная работа`);
 if(ev.includes("ch"))unlock("ch");
 const learned=S.cards.filter(c=>c.box>=4).length,st=streak(),l=lvlOf(G.xp).l;
 const cond={first:G.ok>=1,c5:G.best>=5,c10:G.best>=10,c25:G.best>=25,goal:doneToday()>=G.goal,s3:st>=3,s7:st>=7,l10:learned>=10,l50:learned>=50,lv5:l>=5,lv8:l>=8};
 Object.keys(cond).forEach(k=>cond[k]&&unlock(k));
}
function unlock(id){if(G.ach.includes(id))return;G.ach.push(id);saveG();const a=ACH.find(x=>x[0]===id);if(a)toast(a[1],"Достижение: "+a[2],a[3],true)}
const toasts=[];let toasting=false;
function toast(icon,title,sub,chime){toasts.push([icon,title,sub,chime]);if(!toasting)nextToast()}
function nextToast(){
 const t=toasts.shift();if(!t){toasting=false;return}toasting=true;
 let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);el.offsetWidth}
 el.innerHTML=`<i>${t[0]}</i><div><b>${esc(t[1])}</b><small>${esc(t[2])}</small></div>`;
 if(t[3])SFX.ach();
 requestAnimationFrame(()=>el.classList.add("show"));
 setTimeout(()=>{el.classList.remove("show");setTimeout(nextToast,450)},2300);
}
function confetti(){
 const cv=document.createElement("canvas"),W=innerWidth,H=innerHeight,d=devicePixelRatio||1;cv.id="confetti";cv.width=W*d;cv.height=H*d;document.body.appendChild(cv);
 const x=cv.getContext("2d");x.scale(d,d);
 const C=["#ffb347","#f2701d","#38d394","#35b6ff","#ff5d8f","#ffd166"];
 const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*.38,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,r:Math.random()*6+5,c:pick(C),a:Math.random()*6,va:(Math.random()-.5)*.4}));
 let f=0;(function step(){x.clearRect(0,0,W,H);x.globalAlpha=Math.max(0,1-f/160);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<160)requestAnimationFrame(step);else cv.remove()})();
}
document.addEventListener("pointerdown",e=>{const t=e.target.closest("button,.card,.row");if(!t)return;try{TG.HapticFeedback.impactOccurred("light")}catch(_){}SFX.unlock();if(t.matches("button")&&!t.matches("[data-r],[data-n]"))SFX.tap()});
load().then(checkHS);
