 if(!CS){try{localStorage.setItem("memodremo",json)}catch(e){}return}
 const ch=json.match(/[\s\S]{1,3500}/g)||[],o={md_n:String(ch.length)};ch.forEach((c,i)=>o["md_"+i]=c);
 const my=++saving;cset(o);
}
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR=["#f6c7a4,#ec8f74","#bfe3d0,#6fbf9b","#c9d6ff,#8aa4f0","#ffd9a8,#f5a65b","#e5c8f2,#b58be0","#bde6f0,#5fb4cf"];
const pic=(c,cls="")=>c.img?`<div class="pic ${cls}" style="background-image:url(${c.img})"></div>`:`<div class="pic ${cls}" style="background-image:linear-gradient(145deg,${GR[(+c.id||0)%GR.length]})">${c.e||"💬"}</div>`;
const queue=()=>S.mode==="memo"?S.cards.filter(c=>c.due<=Date.now()):S.cards;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/^\s*-\s*/gm,""));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function topBar(){const due=S.cards.filter(c=>c.due<=Date.now()).length;return`<div class="bar"><div class="av">📚</div><div class="deck-wrap"><div class="deck">Английский каждый день</div><span class="subdeck">${S.cards.length} карточек · ${due} к повторению</span></div><button class="plus" id="add" aria-label="Добавить карточку">+</button></div>
<div class="seg"><button data-m="memo" class="${S.mode==="memo"?"on":""}">Повторение</button><button data-m="dremo" class="${S.mode==="dremo"?"on":""}">Все карточки</button></div>`}
function render(){
const v=document.getElementById("view");
document.getElementById("nav").innerHTML=[["train","⚡","Тренировка"],["decks","🗂️","Колоды"],["lib","📖","Библиотека"],["more","⋯","Ещё"]].map(([k,i,t])=>`<button data-t="${k}" class="${S.tab===k?"on":""}"><i>${i}</i>${t}</button>`).join("");
if(S.tab==="train"){
 const q=queue();if(S.i>=q.length)S.i=0;const c=q[S.i];let h=topBar();
 if(!c){h+=`<main><div class="empty">${S.mode==="memo"?"<strong>На сегодня всё! 🎉</strong>Вы повторили все карточки, которые были запланированы. Переключитесь на «Все карточки», чтобы продолжить.":"<strong>Начнём учиться?</strong>Добавьте свою первую карточку кнопкой +."}</div></main>`}
 else{
  h+=`<main><div class="card ${S.flip?"back":"front"}" id="card">`+(S.flip?`${pic(c)}<div class="en">${esc(c.en)}</div><div class="ru">${esc(c.ru)}</div><button class="fab l" id="del">⋯</button><button class="fab r" id="snd">🔊</button>`:`${pic(c)}<div class="cap">${esc(c.ru)}</div><button class="fab l" id="del">⋯</button><button class="fab r" id="snd">🔊</button>`)+`</div></main>
  <div class="prog"><i style="width:${(S.i+1)/q.length*100}%"></i></div><div class="count">${S.i+1} из ${q.length}</div>`;
  if(S.mode==="memo"&&S.flip)h+=`<div class="acts"><button class="nok" data-r="0">Не помню</button><button class="ok" data-r="1">Помню</button></div>`;
  else if(S.mode==="dremo")h+=`<div class="acts"><button class="nav" data-n="-1">←</button><button class="nav" data-n="1">→</button></div>`;
  else h+=`<div class="acts" style="color:var(--mute);justify-content:center;padding-bottom:12px">Вспомните фразу на английском и коснитесь карточки</div>`;
 }
 v.innerHTML=h;
}else if(S.tab==="decks"){
 v.innerHTML=topBar()+`<main class="list">`+S.cards.map(c=>`<div class="row">${pic(c)}<div class="t"><b>${esc(c.en.split("\n")[0])}</b><small>${esc(c.ru.split("\n")[0])}</small></div><button data-d="${c.id}">🗑</button></div>`).join("")+`</main>`;
}else if(S.tab==="lib"){
 const due=S.cards.filter(c=>c.due<=Date.now()).length,learned=S.cards.filter(c=>c.box>=4).length;
 v.innerHTML=`<main class="list" style="padding-top:14px"><div style="padding:4px 3px 14px"><div class="deck" style="font-size:24px">Ваш прогресс</div><div class="subdeck">Маленькие шаги каждый день</div></div><div class="stat"><b>${S.cards.length}</b><br>карточек в колоде</div><div class="stat"><b>${due}</b><br>ждут повторения сегодня</div><div class="stat"><b>${learned}</b><br>выучено надолго</div><div class="stat"><strong>Как заниматься</strong><br><span class="muted">«Повторение» показывает карточки по расписанию. «Все карточки» позволяет просматривать и слушать весь набор в своём темпе.</span></div></main>`;
}else{
 v.innerHTML=`<main class="list" style="padding-top:14px"><div style="padding:4px 3px 14px"><div class="deck" style="font-size:24px">Настройки</div><div class="subdeck">Ваши данные и прогресс</div></div><div class="stat">Прогресс хранится в этом браузере или в Telegram Cloud Storage.</div><div class="acts" style="padding:0"><button class="nok" id="reset">Сбросить прогресс</button></div></main>`;
}
bind();}
function bind(){
const $=s=>document.querySelector(s);
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.i=0;S.flip=false;render()});
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.tab="train";S.i=0;S.flip=false;render()});
const a=$("#add");if(a)a.onclick=()=>$("#dlg").showModal();
const card=$("#card");if(card)card.onclick=e=>{if(e.target.closest(".fab"))return;S.flip=!S.flip;if(S.flip)speak(queue()[S.i].en);render()};
const snd=$("#snd");if(snd)snd.onclick=()=>speak(queue()[S.i].en);
const del=$("#del");if(del)del.onclick=()=>{if(confirm("Удалить карточку?")){const c=queue()[S.i];S.cards=S.cards.filter(x=>x.id!==c.id);save();S.flip=false;render()}};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const c=queue()[S.i];if(b.dataset.r==="1"){c.box=Math.min(c.box+1,5)}else c.box=0;c.due=Date.now()+GAPS[c.box]*DAY;if(c.box===0)c.due=Date.now()+6e4;save();S.flip=false;render()});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=queue().length;S.i=(S.i+ +b.dataset.n+n)%n;S.flip=false;render()});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.cards=S.cards.filter(x=>x.id!==+b.dataset.d);save();render()});
const rs=$("#reset");if(rs)rs.onclick=()=>{if(confirm("Сбросить весь прогресс?")){S.cards.forEach(c=>{c.box=0;c.due=0});save();S.tab="train";render()}};
}
// Swipe support: swipe left/right in the all-cards mode to move smoothly between cards.
let touchStartX=0,touchStartY=0;
document.addEventListener("touchstart",e=>{const card=e.target.closest("#card");if(!card)return;touchStartX=e.changedTouches[0].clientX;touchStartY=e.changedTouches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{const card=e.target.closest("#card");if(!card||S.tab!=="train"||S.mode!=="dremo")return;const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){const n=queue().length;if(n){S.i=(S.i+(dx<0?1:-1)+n)%n;S.flip=false;render()}}},{passive:true});
const dlg=document.getElementById("dlg");let imgData="";
document.getElementById("cancel").onclick=()=>dlg.close();
document.getElementById("fImg").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);imgData=cv.toDataURL("image/jpeg",.75)};im.src=r.result};r.readAsDataURL(f)};
document.getElementById("save").onclick=()=>{const ru=fRu.value.trim(),en=fEn.value.trim();if(!ru||!en)return;S.cards.push({id:Date.now(),ru,en,img:imgData,box:0,due:0});save();fRu.value=fEn.value=fImg.value="";imgData="";dlg.close();S.tab="train";render()};
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,.card,.row")){try{TG.HapticFeedback.impactOccurred("light")}catch(_){}}});
load();
</script>
</body>
</html>
